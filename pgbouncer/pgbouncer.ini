[databases]
academico = host=db port=5432 dbname=academico

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
admin_users = pgb_admin
stats_users = pgb_admin
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
min_pool_size = 1
reserve_pool_size = 3
reserve_pool_timeout = 3
server_idle_timeout = 60
client_idle_timeout = 300
ignore_startup_parameters = extra_float_digits
# JDBC usa prepareThreshold=0; evita incompatibilidades com conexões em transaction pooling.
log_connections = 1
log_disconnections = 1
